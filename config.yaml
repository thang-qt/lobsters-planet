user_agent: "lobsters-planet/0.1 (local development)"

lobsters:
  users_url: "https://lobste.rs/users"
  request_delay_seconds: 5
  request_timeout_seconds: 15
  old_profile_recheck_days: 7
  max_new_profiles_per_run: 25
  max_old_profiles_per_run: 100

feeds:
  refresh_interval_hours: 6
  request_timeout_seconds: 15
  request_delay_seconds: 2
  discovery_recheck_days: 30
  max_sites_per_discovery_run: 25
  max_feeds_per_refresh_run: 100
  common_paths:
    - "/feed.xml"
    - "/feed"
    - "/rss.xml"
    - "/rss"
    - "/atom.xml"
    - "/index.xml"

output:
  state_file: "state/crawl-state.json"
  public_dir: "public"
  users_per_shard: 500
  max_latest_entries: 300
  homepage_entries: 30
  posts_per_page: 50
  user_entries: 20
  site_title: "Lobsters Planet"
  site_url: "https://lobsters-planet.thangqt.com"
